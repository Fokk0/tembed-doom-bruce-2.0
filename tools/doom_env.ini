
; ---- automatisch von CI angehaengt: Doom als eigene App (laeuft in ota_1) ----
[env:doom-t-embed]
extends = env:__BRUCE_ENV__
board_build.partitions = tembed_partitions.csv
build_src_filter =
  -<*>
  +<../doom_app/>
  +<../doomgeneric/doomgeneric/>
  -<../doomgeneric/doomgeneric/doomgeneric_*.c>
  +<../doomgeneric/doomgeneric/doomgeneric.c>
  -<../doomgeneric/doomgeneric/i_sdl*.c>
  -<../doomgeneric/doomgeneric/i_allegro*.c>
build_flags =
  ${env:__BRUCE_ENV__.build_flags}
  -I${PROJECT_DIR}/doomgeneric/doomgeneric
  -DDOOMGENERIC_RESX=320
  -DDOOMGENERIC_RESY=200
  -Wl,--wrap=M_FileExists
  -Wl,--wrap=W_OpenFile
  -Wl,--wrap=exit
build_src_flags = -w -fcommon -O2
