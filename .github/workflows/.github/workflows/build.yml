name: build-and-publish-webflasher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  BRUCE_ENV: lilygo-t-embed-cc1101
  BRUCE_REF: ""
  WAD_URL: https://distro.ibiblio.org/slitaz/sources/packages/d/doom1.wad

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install platformio

      - name: Bruce und doomgeneric holen
        run: |
          git clone https://github.com/pr3y/Bruce.git bruce
          if [ -n "$BRUCE_REF" ]; then git -C bruce checkout "$BRUCE_REF"; fi
          git clone --depth 1 https://github.com/ozkl/doomgeneric.git bruce/doomgeneric
          sed -i 's|^#define FEATURE_SOUND|// &|' bruce/doomgeneric/doomgeneric/doomfeatures.h || true

      - name: Overlay einspielen und Bruce patchen
        run: |
          cp -r doom_app bruce/doom_app
          cp partitions.csv bruce/tembed_partitions.csv
          cp bruce_overlay/doom_launcher.cpp bruce/src/core/doom_launcher.cpp
          python tools/patch_bruce.py bruce
          sed "s/__BRUCE_ENV__/$BRUCE_ENV/g" tools/doom_env.ini >> bruce/platformio.ini

      - name: Bruce bauen
        run: cd bruce && pio run -e "$BRUCE_ENV"

      - name: Doom bauen
        run: cd bruce && pio run -e doom-t-embed

      - name: WAD besorgen
        run: |
          if [ -f wad/doom1.wad ]; then cp wad/doom1.wad doom1.wad; else curl -fL "$WAD_URL" -o doom1.wad; fi
          ls -l doom1.wad
          head -c 4 doom1.wad | grep -q "IWAD" || { echo "doom1.wad ist kein gueltiges WAD"; exit 1; }
          [ "$(stat -c%s doom1.wad)" -le $((0x440000)) ] || { echo "WAD groesser als Partition"; exit 1; }

      - name: Webflasher zusammenbauen
        run: |
          mkdir -p site/fw
          B=bruce/.pio/build
          cp $B/doom-t-embed/bootloader.bin site/fw/bootloader.bin
          cp $B/doom-t-embed/partitions.bin site/fw/partitions.bin
          cp "$(find ~/.platformio/packages -name boot_app0.bin | head -n1)" site/fw/boot_app0.bin
          cp $B/$BRUCE_ENV/firmware.bin site/fw/bruce.bin
          cp $B/doom-t-embed/firmware.bin site/fw/doom.bin
          cp doom1.wad site/fw/doom1.wad
          ls -l site/fw
          [ "$(stat -c%s site/fw/bruce.bin)" -le $((0x480000)) ] || { echo "Bruce passt nicht in ota_0 (4,5 MB)"; exit 1; }
          [ "$(stat -c%s site/fw/doom.bin)"  -le $((0x200000)) ] || { echo "Doom passt nicht in ota_1 (2 MB)"; exit 1; }
          cp web/index.html web/manifest.json site/

      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
